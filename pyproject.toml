[project]
name = "alice-transmission"
version = "3.0.0"
description = "Private Transmission on DigitalOcean using PocketDeploy"
requires-python = ">=3.11"
dependencies = ["pocketdeploy @ git+https://github.com/pocketcontext/pocketdeploy.git@75b20da90f704a39c745e62ad68907039602bc59"]

[project.scripts]
alice = "alice.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/alice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
