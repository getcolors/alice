# Example Alice desired state. Credentials belong only in COLORS_PAR_*.
profile: alice-example
workdir: .colors
provider-compute: digitalocean
provider-dns: false
provider-backend: local
compute-prevent-destroy: true

# No digitalocean-name: the Droplet is named after the profile, which is what
# already keys state, the machine keypair, and the ~/.ssh/config alias. Supply
# one only to override that label (standards/compute-name.md).
digitalocean-region: ams3
digitalocean-size: s-1vcpu-1gb-35gb-intel
digitalocean-image: ubuntu-24-04-x64
# No digitalocean-vpc-uuid: the region's default VPC is discovered at runtime
# through a data source, and the apply asserts it really is the account default.
# Supply an explicit UUID only to target a VPC that is not the regional default.
# No digitalocean-ssh-keys: the package generates and owns an ed25519 keypair
# named after the profile in ~/.ssh, registers it with DigitalOcean, and removes
# both once the Droplet is destroyed. Supplying an explicit key id here is the
# only way to opt out, and then the package touches no key material at all.
transmission-rpc-port: 9091
transmission-tunnel-local-port: 19091
transmission-local-directory: ~/Downloads/alice
