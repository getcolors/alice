# Copy to an independent deployment directory. Credentials belong in environment.
profile: alice-example
provider-compute: digitalocean
digitalocean-account-id: 00000000-0000-0000-0000-000000000000 # replace with account UUID
digitalocean-region: ams3
digitalocean-size: s-1vcpu-1gb
digitalocean-image: ubuntu-24-04-x64
# digitalocean-vpc-uuid: ... # omit to discover the regional default VPC
compute-prevent-destroy: true
alice-ssh-sources: [0.0.0.0/0]
transmission-rpc-port: 9091
transmission-tunnel-local-port: 19091
transmission-local-directory: ~/Downloads/alice
transmission-magnet-links: []
