# Opt-out fixture: both optional keys are present, so the package must pin what
# it was given and discover nothing. digitalocean-ssh-keys means no key material
# is generated, validated, or deleted, no account key resource is created, and
# the ~/.ssh/config block carries no IdentityFile pair (standards/ssh-keypair.md
# §1, standards/ssh-config.md §3). digitalocean-vpc-uuid means the compute
# template declares no VPC data source and no postcondition.
profile: alice-optout-fixture
workdir: .colors
provider-compute: digitalocean
provider-dns: false
provider-backend: r2
compute-prevent-destroy: true
package: alice

digitalocean-name: alice-test
digitalocean-region: ams3
digitalocean-size: s-1vcpu-1gb-35gb-intel
digitalocean-image: ubuntu-24-04-x64
digitalocean-vpc-uuid: 00000000-0000-4000-8000-000000000000
digitalocean-ssh-keys: "812184"
transmission-rpc-port: 9091
transmission-tunnel-local-port: 19091
transmission-local-directory: ~/Downloads/alice
transmission-magnet-links:
